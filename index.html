<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>матеша (черепок)</title>
<style>
:root {
  --bg: #0a0c0f; --panel: #12161b; --panel2: #181d24;
  --line: #232a33; --line2: #2e3742;
  --txt: #e6e9ee; --dim: #7c8695;
  --acc: #5eead4; --acc2: #22d3ee;
  --bad: #f87171; --good: #4ade80;
}
:root.light-theme {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f9fafb;
  --line: #e5e7eb; --line2: #d1d5db;
  --txt: #111827; --dim: #6b7280;
  --acc: #0d9488; --acc2: #0284c7;
  --bad: #ef4444; --good: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--txt);
  min-height: 100vh; padding: 32px 16px 80px;
  display: flex; justify-content: center;
  font-size: 15px; line-height: 1.5; transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
}
.app { width: 100%; max-width: 680px; position: relative; }
.screen { display: none; animation: fade .2s ease-out; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Верхние кнопки (Тема, Звук) */
.top-controls {
  position: fixed; top: 16px; right: 16px;
  display: flex; gap: 8px; z-index: 100;
}
.icon-btn {
  background: var(--panel); border: 1px solid var(--line); color: var(--txt);
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: .2s;
}
.icon-btn:hover { background: var(--panel2); border-color: var(--line2); }

.logo { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; text-align: center; margin-bottom: 4px; }
.logo .sub { color: var(--dim); font-weight: 400; font-size: 20px; letter-spacing: -.5px; }
.tagline { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 26px; }

.wallet { display: flex; gap: 8px; margin-bottom: 24px; }
.witem { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; transition: background 0.3s; }
.witem span { display: block; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
.witem b { font-size: 18px; color: var(--acc); font-weight: 700; font-variant-numeric: tabular-nums; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.card {
  position: relative; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px 20px; cursor: pointer; color: var(--txt);
  font-family: inherit; text-align: left; transition: all .18s ease; overflow: hidden;
}
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--acc), var(--acc2)); opacity: .6; transition: .18s; }
.card:hover::before { opacity: 1; }
.card:hover { background: var(--panel2); border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 12px 30px -12px rgba(94, 234, 212, .25); }
.card .ttl { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.card .desc { font-size: 12.5px; color: var(--dim); font-weight: 400; line-height: 1.4; }

.btn {
  background: var(--panel); border: 1px solid var(--line); color: var(--txt);
  padding: 14px 18px; border-radius: 12px; font-size: 15px; font-family: inherit;
  font-weight: 600; cursor: pointer; transition: .15s;
}
.btn:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--bg); font-weight: 800; border: none; }
.btn.primary:hover:not(:disabled) { box-shadow: 0 10px 26px -8px rgba(94, 234, 212, .5); }
.btn.wide { width: 100%; margin-top: 10px; }

.back { background: none; border: none; color: var(--dim); font-size: 14px; cursor: pointer; font-family: inherit; padding: 6px 0; margin-bottom: 18px; }
.back:hover { color: var(--acc); }

.h2 { font-size: 22px; font-weight: 800; margin-bottom: 20px; letter-spacing: -.5px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.chips { display: flex; flex-direction: column; gap: 10px; }
.chipbtn {
  padding: 16px 20px; border-radius: 14px; background: var(--panel);
  border: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--txt);
  font-size: 16px; font-family: inherit; font-weight: 600; transition: .15s;
}
.chipbtn:hover { border-color: var(--line2); background: var(--panel2); transform: translateX(4px); box-shadow: -4px 0 0 -2px var(--acc); }
.chipbtn small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 4px; font-weight: 400; }

.qtop { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.ghost { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit; padding: 4px 8px; border-radius: 8px; }
.ghost:hover { color: var(--bad); background: rgba(248, 113, 113, .1); }
.progwrap { flex: 1; height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.prog { height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .3s; border-radius: 99px; }
.qscore { font-size: 15px; font-weight: 700; color: var(--acc); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

.qmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; min-height: 28px; }
.chip { font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); padding: 5px 10px; border-radius: 6px; display: inline-block; letter-spacing: .3px; font-weight: 500; }
.chip.lives { border-color: #4a2b2b; color: var(--bad); background: rgba(248, 113, 113, 0.1); }
.chip.timer { border-color: #4a3a1b; color: #fcd34d; background: rgba(252, 211, 77, 0.1); }
.chip.diff-easy { border-color: #1e5a3e; color: var(--good); background: rgba(74, 222, 128, 0.1); }
.chip.diff-med { border-color: #4a3a1b; color: #fcd34d; background: rgba(252, 211, 77, 0.1); }
.chip.diff-hard { border-color: #4a2020; color: var(--bad); background: rgba(248, 113, 113, 0.1); }

.qtext-container {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none;
  display: flex; flex-direction: column; align-items: center;
}
.qtext {
  font-size: 16px; line-height: 1.65; white-space: pre-wrap;
  font-weight: 500; font-family: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
  text-align: center; width: 100%;
}
canvas.geo-canvas { margin-top: 15px; max-width: 100%; border-radius: 8px; }

/* Блок подсказки */
.hint-bar {
  display: flex; justify-content: flex-end; align-items: center;
  background: var(--panel); border: 1px solid var(--line);
  border-top: none; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
  padding: 8px 16px; margin-bottom: 16px;
}
.hint-btn {
  background: transparent; border: none; color: #fcd34d;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: 0.15s; padding: 4px 8px; border-radius: 6px;
}
.hint-btn:hover { background: rgba(252, 211, 77, 0.1); }
.hint-area {
  display: none; margin-top: 0; margin-bottom: 16px;
  padding: 14px 16px; background: rgba(252, 211, 77, 0.1);
  border: 1px solid #4a3a1b; border-radius: 10px;
  color: #fcd34d; font-size: 14.5px; font-weight: 500; line-height: 1.5;
  animation: fade .2s ease-out;
}

#answerArea { margin-top: 20px; }
.sol-label { font-size: 13px; color: var(--dim); margin-bottom: 8px; display: block; }

.answerInput {
  width: 100%; padding: 15px 18px; font-size: 17px;
  font-family: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
  border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  color: var(--txt); outline: none; transition: .15s;
}
.answerInput:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(94, 234, 212, .12); }

.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width: 460px) { .options { grid-template-columns: 1fr; } }
.opt {
  padding: 16px; font-size: 16px; font-weight: 600; border-radius: 12px;
  font-family: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
  color: var(--txt); background: var(--panel); border: 1px solid var(--line);
  cursor: pointer; transition: .15s;
}
.opt:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); transform: translateY(-1px); }
.opt.correct { border-color: var(--good); background: rgba(74, 222, 128, 0.1); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.1); color: var(--bad); }

.feedback { margin-top: 14px; font-size: 14.5px; font-weight: 600; line-height: 1.6; }
.feedback.good { background: rgba(74, 222, 128, 0.1); border: 1px solid #1e5a3e; color: var(--good); padding: 12px 16px; border-radius: 10px; }
.feedback.bad { background: rgba(248, 113, 113, 0.1); border: 1px solid #5a2020; color: var(--bad); padding: 12px 16px; border-radius: 10px; }

/* Карточки теории */
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
.tcard h3 { font-size: 14px; color: var(--acc); margin-bottom: 16px; letter-spacing: .4px; font-weight: 700; text-transform: uppercase; }
.tcard ul { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.tcard li { font-size: 14.5px; color: var(--txt); padding-left: 12px; border-left: 2px solid var(--line2); font-family: 'JetBrains Mono', ui-monospace, 'Consolas', monospace; white-space: pre-wrap; line-height: 1.6; }
.tcard .ex { padding-left: 12px; border-left: 2px solid var(--acc); font-family: 'JetBrains Mono', ui-monospace, 'Consolas', monospace; font-size: 14px; color: var(--acc); white-space: pre-wrap; line-height: 1.6; }
.tcard .ex-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; font-family: 'Inter', sans-serif; font-weight: 700; }

/* Специальный блок для Дискриминанта */
.candy-theory { margin-top: 30px; padding-top: 20px; border-top: 2px dashed var(--line2); }
.candy-theory h3 { color: #fcd34d; font-size: 16px; margin-bottom: 16px; text-transform: none; letter-spacing: 0; }
.candy-theory p { font-size: 15px; margin-bottom: 12px; line-height: 1.6; color: var(--txt); }
.candy-theory ul { padding-left: 20px; margin-bottom: 16px; }
.candy-theory li { background: none; border: none; padding: 0; margin-bottom: 8px; list-style-type: disc; color: var(--txt); font-family: inherit; font-size: 15px; line-height: 1.5; }
.candy-theory code { background: rgba(150, 150, 150, 0.2); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
.candy-theory .formula { text-align: center; font-size: 18px; font-weight: bold; margin: 16px 0; color: var(--acc); }

.practice { margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line); }
.practice h3 { font-size: 16px; margin-bottom: 14px; color: var(--txt); }

.resBig { font-size: 44px; text-align: center; margin: 6px 0 14px; color: var(--acc); font-weight: 900; letter-spacing: -2px; }
.resTitle { font-size: 22px; text-align: center; font-weight: 800; margin-bottom: 22px; }
.resGrid { display: flex; gap: 10px; margin-bottom: 16px; }
.resGrid .witem b { font-size: 20px; }
.record { text-align: center; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 20px; font-size: 14px; color: var(--dim); }
.record b { color: var(--acc); }

/* Черновик */
.scratch-toggle { background: var(--panel); border: 1px solid var(--line); color: var(--dim); padding: 10px 16px; border-radius: 10px; cursor: pointer; width: 100%; text-align: left; font-family: inherit; font-size: 14px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; transition: .15s; }
.scratch-toggle:hover { border-color: var(--line2); color: var(--txt); }
.scratch-container { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-top: 8px; overflow: hidden; }
.scratch-container.open { display: block; }
.scratch-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.scratch-tools { display: flex; gap: 6px; }
.scratch-btn { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600; transition: .15s; }
.scratch-btn:hover { background: rgba(150, 150, 150, 0.1); color: var(--txt); }
.scratch-btn.active { background: var(--bg); border-color: var(--line); color: var(--acc); }
.scratch-content { position: relative; }
#drawCanvas { display: block; width: 100%; height: 220px; cursor: crosshair; background: var(--bg); }
.scratch-textarea { display: none; width: 100%; height: 220px; background: var(--bg); border: none; color: var(--txt); padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 15px; resize: vertical; outline: none; }
</style>
</head>
<body>
<div class="top-controls">
  <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Сменить тему">🌙</button>
  <button class="icon-btn" onclick="toggleSound()" id="soundBtn" title="Звук">🔊</button>
</div>

<div class="app">
<section id="s-home" class="screen active">
  <div class="logo">матеша <span class="sub">(черепок)</span></div>
  <p class="tagline">алгебра и геометрия — в виде игры</p>
  <div class="wallet" id="wallet"></div>
  <div class="grid2">
    <button class="card" onclick="chooseSubject('alg')">
      <div class="ttl">Алгебра</div>
      <div class="desc">Дроби, уравнения, корни, дискриминант</div>
    </button>
    <button class="card" onclick="chooseSubject('geo')">
      <div class="ttl">Геометрия</div>
      <div class="desc">Углы, площади, треугольники, Пифагор</div>
    </button>
  </div>
</section>

<section id="s-mode" class="screen">
  <button class="back" onclick="goHome()">← В меню</button>
  <h2 class="h2" id="modeTitle"></h2>
  <div class="grid2">
    <button class="card" onclick="setMode('study')">
      <div class="ttl">Изучение</div>
      <div class="desc">Формулы и практика без штрафов</div>
    </button>
    <button class="card" onclick="setMode('test')">
      <div class="ttl">Тест</div>
      <div class="desc">Очки, жизни и рекорды</div>
    </button>
  </div>
</section>

<section id="s-study" class="screen">
  <button class="back" onclick="show('s-mode')">← Назад</button>
  <h2 class="h2">Изучение</h2>
  <div class="grid2">
    <button class="card" onclick="openTheory(false)">
      <div class="ttl">Теория</div>
      <div class="desc">Только формулы и примеры</div>
    </button>
    <button class="card" onclick="openTheory(true)">
      <div class="ttl">Теория + практика</div>
      <div class="desc">Формулы и примеры с проверкой</div>
    </button>
  </div>
</section>

<section id="s-theory" class="screen">
  <button class="back" onclick="show('s-study')">← Назад</button>
  <h2 class="h2" id="theoryTitle"></h2>
  <div id="theoryBox"></div>
  <div id="practiceBox" class="practice" style="display:none"></div>
</section>

<section id="s-wiz" class="screen">
  <button class="back" onclick="wizBack()">← Назад</button>
  <h2 class="h2" id="wizTitle"></h2>
  <div class="chips" id="wizOptions"></div>
</section>

<section id="s-quiz" class="screen">
  <div class="qtop">
    <button class="ghost" onclick="quitQuiz()">×</button>
    <div class="progwrap"><div class="prog" id="progBar"></div></div>
    <div class="qscore" id="qScore">0</div>
  </div>
  <div class="qmeta">
    <span class="chip" id="qTopic"></span>
    <span class="chip" id="qDiff"></span>
    <span class="chip lives" id="qLives"></span>
    <span class="chip timer" id="qTimer"></span>
  </div>
  
  <div class="qtext-container">
    <div class="qtext" id="qText"></div>
    <canvas id="geoCanvas" class="geo-canvas" width="300" height="200" style="display:none;"></canvas>
  </div>
  
  <div class="hint-bar">
    <button class="hint-btn" id="hintBtn" onclick="showHint()">Подсказка</button>
  </div>
  <div class="hint-area" id="hintArea"></div>

  <button class="scratch-toggle" onclick="toggleScratchpad()" id="scratchToggleBtn">
    <span>📝 Черновик (рисовать / писать)</span>
    <span id="scratchChevron">▼</span>
  </button>
  <div class="scratch-container" id="scratchContainer">
    <div class="scratch-header">
      <div class="scratch-tools">
        <button class="scratch-btn active" onclick="setScratchMode('draw')" id="btnModeDraw">✏️ Рисовать</button>
        <button class="scratch-btn" onclick="setScratchMode('text')" id="btnModeText">⌨️ Текст</button>
        <button class="scratch-btn" onclick="setScratchTool('eraser')" id="btnToolEraser">🧽 Ластик</button>
      </div>
      <button class="scratch-btn" onclick="clearScratchpad()">🗑️ Очистить</button>
    </div>
    <div class="scratch-content">
      <canvas id="drawCanvas"></canvas>
      <textarea id="textCanvas" class="scratch-textarea" placeholder="Пиши здесь вычисления..."></textarea>
    </div>
  </div>

  <div id="answerArea" style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line);"></div>
  
  <div class="feedback" id="feedback"></div>
  <button class="btn primary wide" id="nextBtn" onclick="nextQ()" style="display:none">Дальше →</button>
</section>

<section id="s-result" class="screen">
  <div class="resBig" id="resEmoji">!</div>
  <h2 class="resTitle" id="resTitle"></h2>
  <div class="resGrid" id="resGrid"></div>
  <div class="record" id="recordInfo"></div>
  
  <!-- Разбор ошибок -->
  <div id="reviewBox" style="display:none; margin-bottom: 20px;">
    <h3 style="font-size: 16px; margin-bottom: 10px;">Разбор ошибок:</h3>
    <div id="reviewList" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <div class="grid2">
    <button class="btn" onclick="replay()">Ещё раз</button>
    <button class="btn primary" onclick="goHome()">В меню</button>
  </div>
</section>
</div>

<script>
/* ================= ЗВУКИ ================= */
let soundEnabled = true;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!soundEnabled) return;
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'good') {
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'bad') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  el('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
}

/* ================= ТЕМА ================= */
function toggleTheme() {
  const root = document.documentElement;
  root.classList.toggle('light-theme');
  const isLight = root.classList.contains('light-theme');
  el('themeBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('matesha_theme', isLight ? 'light' : 'dark');
}
if (localStorage.getItem('matesha_theme') === 'light') {
  document.documentElement.classList.add('light-theme');
  setTimeout(() => { el('themeBtn').textContent = '☀️'; }, 100);
}

/* ================= УТИЛИТЫ ================= */
const el = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const SUP = {2:'²',3:'³',4:'⁴',5:'⁵'};
const sgn = n => n<0 ? `− ${Math.abs(n)}` : `+ ${n}`;
function fmt(n){
  if(Number.isInteger(n)) return String(n);
  return (Math.round(n*100)/100).toString().replace('.',',');
}

/* ================= ОТРИСОВКА ГЕОМЕТРИИ НА CANVAS ================= */
function drawGeometry(canvasId, type, params, showMarks) {
  const canvas = el(canvasId);
  const ctx = canvas.getContext('2d');
  const isLight = document.documentElement.classList.contains('light-theme');
  
  const colorLine = isLight ? '#0d9488' : '#5eead4';
  const colorText = isLight ? '#111827' : '#e6e9ee';
  const colorAccent = isLight ? '#ef4444' : '#f87171';
  
  canvas.width = 300;
  canvas.height = 200;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.lineWidth = 2;
  ctx.strokeStyle = colorLine;
  ctx.fillStyle = colorLine;
  ctx.font = '14px "JetBrains Mono", monospace';
  
  if (type === 'triangle') {
    const pA = {x: 150, y: 30};
    const pB = {x: 50, y: 170};
    const pC = {x: 250, y: 170};
    
    ctx.beginPath();
    ctx.moveTo(pA.x, pA.y);
    ctx.lineTo(pB.x, pB.y);
    ctx.lineTo(pC.x, pC.y);
    ctx.closePath();
    ctx.stroke();
    
    ctx.fillStyle = colorText;
    ctx.fillText('A', pA.x - 5, pA.y - 10);
    ctx.fillText('B', pB.x - 15, pB.y + 15);
    ctx.fillText('C', pC.x + 10, pC.y + 15);
    
    if (showMarks) {
      // Углы
      ctx.beginPath();
      ctx.arc(pA.x, pA.y, 20, Math.PI * 0.6, Math.PI * 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(pB.x, pB.y, 20, Math.PI * 1.1, Math.PI * 1.4);
      ctx.stroke();
      
      // Стороны
      if (params.sides === 'equal') {
        drawTick(ctx, pA, pB);
        drawTick(ctx, pB, pC);
        drawTick(ctx, pC, pA);
      }
    }
  } else if (type === 'rect') {
    ctx.strokeRect(75, 50, 150, 100);
    if (showMarks) {
      // Прямые углы
      drawRightAngle(ctx, 75, 50);
      drawRightAngle(ctx, 225, 50);
      drawRightAngle(ctx, 225, 150);
      drawRightAngle(ctx, 75, 150);
    }
  } else if (type === 'sq') {
    ctx.strokeRect(100, 50, 100, 100);
    if (showMarks) {
      drawRightAngle(ctx, 100, 50);
      drawRightAngle(ctx, 200, 50);
      drawRightAngle(ctx, 200, 150);
      drawRightAngle(ctx, 100, 150);
    }
  }
  
  canvas.style.display = 'block';
}

function drawTick(ctx, p1, p2) {
  const midX = (p1.x + p2.x) / 2;
  const midY = (p1.y + p2.y) / 2;
  const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  ctx.save();
  ctx.translate(midX, midY);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -5);
  ctx.lineTo(0, 5);
  ctx.stroke();
  ctx.restore();
}

function drawRightAngle(ctx, x, y) {
  ctx.beginPath();
  ctx.moveTo(x + 10, y);
  ctx.lineTo(x + 10, y + 10);
  ctx.lineTo(x, y + 10);
  ctx.stroke();
}

/* ================= ЧЕРНОВИК ================= */
let canvas, ctx;
let isDrawing = false;
let currentTool = 'pen';
let shiftPressed = false;
let lastX = 0, lastY = 0;

function initCanvas() {
  canvas = el('drawCanvas');
  ctx = canvas.getContext('2d');
  
  const resizeCanvas = () => {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width > 0 && canvas.width !== rect.width) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
      canvas.width = rect.width;
      canvas.height = 220;
      ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      updatePenStyle();
    }
  };

  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    draw({ clientX: touch.clientX, clientY: touch.clientY });
  });
  canvas.addEventListener('touchend', stopDrawing);

  window.addEventListener('keydown', e => { if (e.key === 'Shift') shiftPressed = true; });
  window.addEventListener('keyup', e => { if (e.key === 'Shift') shiftPressed = false; });
}

function updatePenStyle() {
  const isLight = document.documentElement.classList.contains('light-theme');
  if (currentTool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = isLight ? '#0d9488' : '#5eead4';
    ctx.lineWidth = 2;
  } else {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 15;
  }
}

function startDrawing(e) {
  if (el('drawCanvas').style.display === 'none') return;
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  lastX = e.clientX - rect.left;
  lastY = e.clientY - rect.top;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
}

function draw(e) {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  let curX = e.clientX - rect.left;
  let curY = e.clientY - rect.top;
  
  if (shiftPressed && currentTool === 'pen') {
    const dx = curX - lastX;
    const dy = curY - lastY;
    const angle = Math.atan2(dy, dx);
    const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
    const length = Math.sqrt(dx*dx + dy*dy);
    curX = lastX + Math.cos(snappedAngle) * length;
    curY = lastY + Math.sin(snappedAngle) * length;
  }
  
  ctx.lineTo(curX, curY);
  ctx.stroke();
  if (!shiftPressed) {
    lastX = curX; lastY = curY;
  }
}

function stopDrawing() { isDrawing = false; }

function setScratchTool(tool) {
  currentTool = tool;
  el('btnToolEraser').classList.toggle('active', tool === 'eraser');
  el('btnModeDraw').classList.toggle('active', tool === 'pen');
  updatePenStyle();
}

function setScratchMode(mode) {
  if (mode === 'draw') {
    el('drawCanvas').style.display = 'block';
    el('textCanvas').style.display = 'none';
    el('btnModeDraw').classList.add('active');
    el('btnModeText').classList.remove('active');
    setScratchTool('pen');
  } else {
    el('drawCanvas').style.display = 'none';
    el('textCanvas').style.display = 'block';
    el('btnModeDraw').classList.remove('active');
    el('btnModeText').classList.add('active');
    el('btnToolEraser').classList.remove('active');
    el('textCanvas').focus();
  }
}

function toggleScratchpad() {
  const c = el('scratchContainer');
  const isOpen = c.classList.contains('open');
  if (isOpen) {
    c.classList.remove('open');
    el('scratchChevron').textContent = '▼';
  } else {
    c.classList.add('open');
    el('scratchChevron').textContent = '▲';
    setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
  }
}

function clearScratchpad() {
  if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
  el('textCanvas').value = '';
}

}
function wizPickIndex(i){
  state[WIZ[wizIndex].key] = WIZ[wizIndex].options[i].v;
  if(wizIndex < WIZ.length-1){ wizIndex++; renderWiz(); } else { startTest(); }
}
function wizBack(){ if(wizIndex === 0){ show('s-mode'); return; } wizIndex--; renderWiz(); }

/* ================= ТЕСТ ================= */
function buildQuestions(){
  const pool = poolFor(state.subject, state.grade);
  const list = [];
  let last = null;
  while(list.length < state.count){
    const g = pick(pool);
    if(pool.length > 1 && g === last) continue;
    let item = g.gen(state.diff);
    item.topic = g.topic; item.hint = g.hint; item.gId = g.id;
    list.push(item); last = g;
  }
  state.questions = list;
}

function startTest(){
  buildQuestions();
  state.count = state.questions.length; state.idx = 0;
  state.score = 0; state.correct = 0; state.streak = 0; state.bestStreak = 0;
  state.lives = 3; state.mistakes = [];
  
  clearScratchpad();
  el('scratchContainer').classList.remove('open');
  el('scratchChevron').textContent = '▼';
  setScratchMode('draw');

  show('s-quiz');
  renderQuestion();
}

function makeOptions(ans){
  const set = new Set([ans]);
  let guard = 0;
  const offsets = Math.abs(ans) >= 100 ? [10, 20, 30, -10, -20, -30] : [1, 2, 3, 4, -1, -2, -3, -4];
  while(set.size < 4 && guard++ < 300){
    let v = ans + pick(offsets);
    set.add(v);
  }
  return shuffle([...set]);
}

function renderQuestion(){
  const q = state.questions[state.idx];
  state.answered = false;

  el('feedback').className = 'feedback'; el('feedback').textContent = '';
  el('nextBtn').style.display = 'none';
  el('progBar').style.width = (state.idx / state.count * 100) + '%';
  el('qScore').textContent = String(state.score);
  el('qTopic').textContent = q.topic;
  
  el('qDiff').textContent = ['Легко','Средне','Сложно'][state.diff];
  el('qDiff').className = 'chip ' + ['diff-easy','diff-med','diff-hard'][state.diff];
  if(state.diff === 0){ el('qLives').style.display = 'none'; } 
  else { el('qLives').style.display = 'inline-block'; el('qLives').textContent = 'жизни: ' + state.lives; }

  el('qText').textContent = q.q;
  el('hintArea').style.display = 'none'; el('hintBtn').style.display = 'inline-block'; el('hintArea').textContent = q.hint;

  // Графика
  if (q.draw) {
    drawGeometry('geoCanvas', q.draw.type, q.draw.params, state.diff === 0);
  } else {
    el('geoCanvas').style.display = 'none';
  }

  const area = el('answerArea'); area.innerHTML = '';
  if(state.answerMode === 'input'){
    area.innerHTML = `
      <label class="sol-label">Твоё решение:</label>
      <form id="ansForm" onsubmit="return submitInput(event)">
        <input class="answerInput" id="ansInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Введи ответ…">
        <button class="btn primary wide" type="submit">Проверить</button>
      </form>`;
    setTimeout(()=>{ const i = el('ansInput'); if(i) i.focus(); }, 60);
  } else {
    state.currentOpts = makeOptions(q.a);
    const box = document.createElement('div'); box.className = 'options';
    state.currentOpts.forEach((o,i)=>{
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = fmt(o);
      b.onclick = () => submitChoice(i); box.appendChild(b);
    });
    area.appendChild(box);
  }
  startTimer();
}

function showHint(){ el('hintArea').style.display = 'block'; el('hintBtn').style.display = 'none'; }
function startTimer(){
  clearInterval(state.timer);
  const box = el('qTimer');
  if(state.diff !== 2){ box.style.display = 'none'; return; }
  box.style.display = 'inline-block'; state.timeLeft = 40; box.textContent = 'время: 40';
  state.timer = setInterval(()=>{
    state.timeLeft--; box.textContent = 'время: ' + Math.max(0, state.timeLeft);
    if(state.timeLeft <= 0){ clearInterval(state.timer); answerWith(NaN, -1, true); }
  }, 1000);
}

function submitInput(e){ e.preventDefault(); if(state.answered) return false; answerWith(parseFloat(el('ansInput').value.replace(/,/g,'.')), -1, false); return false; }
function submitChoice(i){ if(!state.answered) answerWith(state.currentOpts[i], i, false); }

function answerWith(value, optIdx, timeout){
  if(state.answered) return; state.answered = true; clearInterval(state.timer);
  const q = state.questions[state.idx];
  const ok = !isNaN(value) && Math.abs(value - q.a) < 0.011;

  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const inp = el('ansInput'); if(inp) inp.disabled = true;
  const subBtn = document.querySelector('#ansForm button'); if(subBtn) subBtn.disabled = true;

  if(state.answerMode === 'choice'){
    document.querySelectorAll('.opt').forEach((b,i)=>{
      if(Math.abs(state.currentOpts[i] - q.a) < 0.011) b.classList.add('correct');
      else if(i === optIdx) b.classList.add('wrong');
    });
  }

  if(ok){
    playSound('good');
    state.correct++; state.streak++;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
    const gain = [10,20,30][state.diff] + (state.streak - 1) * 5;
    state.score += gain;
    el('feedback').className = 'feedback good';
    el('feedback').textContent = `Верно! +${gain}` + (state.streak > 1 ? ` (серия ${state.streak})` : '');
  } else {
    playSound('bad');
    state.mistakes.push({...q, userAnswer: value});
    state.streak = 0; if(state.diff > 0) state.lives--;
    el('feedback').className = 'feedback bad';
    let fbText = (timeout ? 'Время вышло. ' : 'Неверно. ') + 'Правильный ответ: ' + fmt(q.a);
    if (q.sol) fbText += `<br><span style="font-size:13px;opacity:0.8;font-weight:400;">Решение: ${q.sol}</span>`;
    el('feedback').innerHTML = fbText;
    if(state.diff > 0) el('qLives').textContent = 'жизни: ' + Math.max(0, state.lives);
  }

  el('qScore').textContent = String(state.score);
  const isLast = (state.lives <= 0) || (state.idx + 1 >= state.count);
  el('nextBtn').style.display = 'block';
  el('nextBtn').textContent = isLast ? 'К результатам' : 'Дальше';
  el('nextBtn').focus();
}

function nextQ(){
  if(state.lives <= 0 || state.idx + 1 >= state.count){ finish(); return; }
  clearScratchpad(); el('scratchContainer').classList.remove('open'); el('scratchChevron').textContent = '▼';
  state.idx++; renderQuestion();
}
function quitQuiz(){ clearInterval(state.timer); goHome(); }

/* ================= РЕЗУЛЬТАТ ================= */
function finish(){
  clearInterval(state.timer);
  const total = state.count, correct = state.correct;
  const pct = total ? Math.round(correct / total * 100) : 0;

  const s = store.get();
  const prevBest = s.best || 0;
  s.total = (s.total || 0) + state.score; s.games = (s.games || 0) + 1;
  const isRecord = state.score > prevBest; if(isRecord) s.best = state.score;
  store.set(s);

  let big = pct+'%', title = 'Стоит повторить теорию';
  if(pct === 100) title='Идеально'; else if(pct >= 80) title='Отличная работа'; else if(pct >= 60) title='Неплохо';

  el('resEmoji').textContent = big; el('resTitle').textContent = title;
  el('resGrid').innerHTML = `
    <div class="witem"><span>Верно</span><b>${correct}/${total}</b></div>
    <div class="witem"><span>Очки</span><b>${state.score}</b></div>
    <div class="witem"><span>Серия</span><b>${state.bestStreak}</b></div>`;
  el('recordInfo').innerHTML = isRecord ? 'Новый рекорд. Прошлый: ' + prevBest : 'Рекорд: <b>' + s.best + '</b> · Всего: <b>' + s.total + '</b>';

  // Разбор ошибок
  if (state.mistakes.length > 0) {
    el('reviewBox').style.display = 'block';
    el('reviewList').innerHTML = state.mistakes.map(m => `
      <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;">
        <div style="font-size: 13px; color: var(--dim); margin-bottom: 4px;">${m.topic}</div>
        <div style="font-weight: 600; margin-bottom: 8px;">${escapeHtml(m.q.split('\n')[0])}...</div>
        <div style="font-size: 14px; color: var(--good);">Правильно: ${fmt(m.a)}</div>
        <div style="font-size: 14px; color: var(--bad);">Твой ответ: ${isNaN(m.userAnswer) ? 'Нет' : fmt(m.userAnswer)}</div>
        ${m.sol ? `<div style="font-size: 13px; color: var(--acc); margin-top: 6px;">${m.sol}</div>` : ''}
      </div>
    `).join('');
  } else {
    el('reviewBox').style.display = 'none';
  }

  show('s-result');
}

function replay(){ startTest(); }
renderWallet();
</script>
